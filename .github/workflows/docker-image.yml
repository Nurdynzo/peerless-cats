name: Check Input Against Secret

on:
  workflow_dispatch:
    inputs:
      user_input:
        description: 'Input to compare with secret'
        required: true

jobs:
  check-secret:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Compare input with secret
        if: github.event.inputs.user_input == secrets.PASSWORD
        run: echo "Input matches the secret!"
